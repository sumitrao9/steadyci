name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" PyYAML
      - name: Lint
        run: python3 -m ruff check .
      - name: Test
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Self-scan (SARIF)
        run: PYTHONPATH=. python3 -m steadyci.cli scan . --format sarif --fail-on none --no-telemetry > steadyci.sarif
      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@4e2025d65da0b3306b50f664dcd031b7fa208376 # v3.28.x
        with:
          sarif_file: steadyci.sarif
